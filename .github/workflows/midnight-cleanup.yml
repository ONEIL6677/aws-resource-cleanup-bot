name: AWS Midnight Cleanup

on:
  schedule:
    - cron: "*/45 * * * *"   # runs every 5 mins
  workflow_dispatch:        # allows manual trigger from GitHub UI

jobs:
  cleanup:
    name: Delete All AWS Resources
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Make scripts executable
        run: chmod +x scripts/cleanup.sh scripts/cleanup-all-regions.sh

      - name: Run Cleanup Across All Regions
        run: bash scripts/cleanup-all-regions.sh

      - name: Upload Cleanup Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30
